<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="CSS/index.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="JS/storage.js" defer></script>

    <script src="JS/UI.js" defer></script>

    <script src="JS/alumnos.js" defer></script>




    <title>SGA - Alumnos</title>
</head>

<body>

    <header>
        <h1>Sistema de Gestión Académica</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html" class="activo">Alumnos</a>
            <a href="docentes.html">Docentes</a>
        </nav>
    </header>

    <main>

        <!-- FORMULARIO PARA AGREGAR ALUMNOS -->
        <section class="formulario">

            <h2>Alta de Alumno</h2>

            <form id="formAlumno">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre">

                <br><br>

                <label for="carrera">Carrera</label>
                <input type="text" id="carrera">

                <br><br>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo">

                <br><br>

                <button type="submit">Guardar Alumno</button>

                <button type="button" id="btnCancelar" style="display: none;">
                    Cancelar
                </button>
            </form>

            <p id="mensaje" class="oculto"></p>

        </section>


        <!-- LISTA DE ALUMNOS -->
        <section class="alumnos">

            <h2>Alumnos registrados</h2>

            <p id="cantidadAlumnos"></p>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Carrera</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="listaAlumnos"></tbody>

            </table>

        </section>

    </main>

</body>

</html>
