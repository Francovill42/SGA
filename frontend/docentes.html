<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/index.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="JS/storage.js" defer></script>

    <script src="JS/UI.js" defer></script>

    <script src="JS/docentes.js" defer></script>





    <title>SGA - Docentes</title>
</head>

<body>

    <header>
        <h1>Sistema de Gestión Académica</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html">Alumnos</a>
            <a href="docentes.html" class="activo">Docentes</a>
        </nav>
    </header>

    <main>

        <!-- FORMULARIO PARA AGREGAR DOCENTES -->
        <section class="formulario">

            <h2>Alta de Docente</h2>

            <form id="formDocente">

                <label for="nombreDocente">Nombre</label>
                <input type="text" id="nombreDocente">

                <br><br>

                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad">

                <br><br>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo">

                <br><br>

                <button type="submit">Guardar Docente</button>

                <button type="button" id="btnCancelar" style="display: none;">
                    Cancelar
                </button>
            </form>

            <p id="mensaje" class="oculto"></p>

        </section>


        <!-- LISTA DE DOCENTES -->
        <section class="docentes">

            <h2>Docentes registrados</h2>

            <p id="cantidadDocentes"></p>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especialidad</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="listaDocentes"></tbody>

            </table>

        </section>

    </main>

</body>

</html>
